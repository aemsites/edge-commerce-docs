<svg xmlns="http://www.w3.org/2000/svg" width="320" height="568" viewBox="0 0 320 568" role="img" aria-label="PIM catalog data reaches Product Bus and Product Index. PDP and PLP requests share AEM Network and Product Pipeline, reading Product Bus and Product Index respectively." aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Catalog updates and PDP and PLP requests</title>
  <desc id="diagram-desc">PIM data passes through ETL and the API into Product Bus. The Indexer builds Product Index. PDP and PLP requests both pass through AEM Network and Product Pipeline. PDP reads Product Bus and returns product HTML; PLP reads Product Index JSON.</desc>
  <defs>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--line)"/></marker>
    <marker id="arrow-pdp" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--pdp)"/></marker>
    <marker id="arrow-plp" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--plp)"/></marker>
    <style>
      :root{color-scheme:dark;--bg:#101824;--node:#151F2D;--tile:#101824;--border:#35465D;--line:#75839A;--text:#F1F5FA;--desc:#A7B3C3;--muted:#8593A8;--pdp:#4CF490;--plp:#02BEFA}
      .frame{fill:var(--bg);stroke:var(--border);stroke-width:1}
      .node{fill:var(--node);stroke:var(--border);stroke-width:1}
      .tile{fill:var(--tile);stroke:var(--border);stroke-width:1}
      .line{fill:none;stroke:var(--line);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
      .pdp-line{fill:none;stroke:var(--pdp);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
      .plp-line{fill:none;stroke:var(--plp);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
      .tick{fill:var(--pdp);animation:tick 2.6s ease-in-out infinite}
      @keyframes tick{0%,100%{opacity:1}50%{opacity:.3}}
      .muted{fill:var(--muted);font:8.5px system-ui,-apple-system,sans-serif;letter-spacing:1px}
      .name{fill:var(--text);font:600 11.5px system-ui,-apple-system,sans-serif;letter-spacing:.35px}
      .desc{fill:var(--desc);font:9.5px system-ui,-apple-system,sans-serif}
      .pkt{animation-timing-function:linear;animation-iteration-count:infinite}
      .ring{transform-box:fill-box;transform-origin:center;opacity:0;animation-timing-function:linear;animation-iteration-count:infinite}
      .glow{opacity:0;animation-timing-function:linear;animation-iteration-count:infinite}
      /* @motion:css */
    /* generated by timeline.py — loop 8s — edit the spec, not this block */
    .story, .pkt, .ring, .glow, .bar { animation-duration: 8s; }
    /* m1: PDP request reaches AEM Network */
    @keyframes m1 {
      0%, 2.5% { transform: translate(0, 0); opacity: 0; }
      3.25% { opacity: 1; }
      10.63% { transform: translate(0px, 32px); opacity: 1; }
      12.13%, 100% { transform: translate(0px, 32px); opacity: 0; }
    }
    @keyframes m1-ring { 0%, 10.63% { transform: scale(0.4); opacity: 0; } 11.13% { transform: scale(0.5); opacity: 0.8; } 16.88%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes m1-glow { 0%, 10.63% { opacity: 0; } 11.63% { opacity: 0.3; } 15.62%, 100% { opacity: 0; } }
    /* m2: AEM Network routes PDP request to Product Pipeline */
    @keyframes m2 {
      0%, 13.12% { transform: translate(0, 0); opacity: 0; }
      13.88% { opacity: 1; }
      21.25% { transform: translate(0px, 24px); opacity: 1; }
      22.75%, 100% { transform: translate(0px, 24px); opacity: 0; }
    }
    @keyframes m2-ring { 0%, 21.25% { transform: scale(0.4); opacity: 0; } 21.75% { transform: scale(0.5); opacity: 0.8; } 27.5%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes m2-glow { 0%, 21.25% { opacity: 0; } 22.25% { opacity: 0.3; } 26.25%, 100% { opacity: 0; } }
    /* m3: Product Pipeline reads PDP data from Product Bus */
    @keyframes m3 {
      0%, 23.75% { transform: translate(0, 0); opacity: 0; }
      24.36% { opacity: 1; }
      24.37% { transform: translate(20px, 0px); }
      34.38% { transform: translate(20px, 324px); }
      35% { transform: translate(0px, 324px); opacity: 1; }
      36.5%, 100% { transform: translate(0px, 324px); opacity: 0; }
    }
    @keyframes m3-ring { 0%, 35% { transform: scale(0.4); opacity: 0; } 35.5% { transform: scale(0.5); opacity: 0.8; } 41.25%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes m3-glow { 0%, 35% { opacity: 0; } 36% { opacity: 0.3; } 40%, 100% { opacity: 0; } }
    /* m4: PLP index request reaches AEM Network */
    @keyframes m4 {
      0%, 45% { transform: translate(0, 0); opacity: 0; }
      45.75% { opacity: 1; }
      53.13% { transform: translate(0px, 32px); opacity: 1; }
      54.63%, 100% { transform: translate(0px, 32px); opacity: 0; }
    }
    @keyframes m4-ring { 0%, 53.13% { transform: scale(0.4); opacity: 0; } 53.63% { transform: scale(0.5); opacity: 0.8; } 59.38%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes m4-glow { 0%, 53.13% { opacity: 0; } 54.13% { opacity: 0.3; } 58.13%, 100% { opacity: 0; } }
    /* m5: AEM Network routes PLP request to Product Pipeline */
    @keyframes m5 {
      0%, 55.63% { transform: translate(0, 0); opacity: 0; }
      56.38% { opacity: 1; }
      63.75% { transform: translate(0px, 24px); opacity: 1; }
      65.25%, 100% { transform: translate(0px, 24px); opacity: 0; }
    }
    @keyframes m5-ring { 0%, 63.75% { transform: scale(0.4); opacity: 0; } 64.25% { transform: scale(0.5); opacity: 0.8; } 70%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes m5-glow { 0%, 63.75% { opacity: 0; } 64.75% { opacity: 0.3; } 68.75%, 100% { opacity: 0; } }
    /* m6: Product Pipeline reads PLP data from Product Index */
    @keyframes m6 {
      0%, 66.25% { transform: translate(0, 0); opacity: 0; }
      67% { opacity: 1; }
      67.07% { transform: translate(-20px, 0px); }
      76.68% { transform: translate(-20px, 236px); }
      77.5% { transform: translate(0px, 236px); opacity: 1; }
      79%, 100% { transform: translate(0px, 236px); opacity: 0; }
    }
    @keyframes m6-ring { 0%, 77.5% { transform: scale(0.4); opacity: 0; } 78% { transform: scale(0.5); opacity: 0.8; } 83.75%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes m6-glow { 0%, 77.5% { opacity: 0; } 78.5% { opacity: 0.3; } 82.5%, 100% { opacity: 0; } }
    /* @/motion:css */
      @media (prefers-reduced-motion: reduce){.pkt,.ring,.glow{animation:none!important;visibility:hidden}.tick{animation:none!important}}
    </style>
  </defs>
  <rect class="frame" x=".5" y=".5" width="319" height="567" rx="12"/>
  <text class="muted" x="32" y="18">CATALOG UPDATE</text>

  <!-- Static catalog update path: PIM → ETL → API → Product Bus → Indexer → Product Index. -->
  <g class="line" marker-end="url(#arrow)">
    <path d="M160 60V72"/><path d="M160 104V116"/><path d="M160 148V160"/>
    <path d="M160 192V204"/><path d="M160 236V248"/>
  </g>
  <!-- Static storefront and product-data paths. -->
  <path class="pdp-line" d="M98 376V408" marker-end="url(#arrow-pdp)"/>
  <path class="plp-line" d="M222 376V408" marker-end="url(#arrow-plp)"/>
  <path class="pdp-line" d="M108 452V476" marker-end="url(#arrow-pdp)"/>
  <path class="plp-line" d="M212 452V476" marker-end="url(#arrow-plp)"/>
  <path class="pdp-line" d="M288 176H308V500H288" marker-end="url(#arrow-pdp)"/>
  <path class="plp-line" d="M32 264H12V500H32" marker-end="url(#arrow-plp)"/>

  <g><rect class="node" x="32" y="28" width="256" height="32" rx="6"/><circle class="tick" cx="46" cy="44" r="2.5"/><text class="name" x="58" y="48">PIM</text><text class="desc" x="276" y="48" text-anchor="end">catalog source</text></g>
  <g><rect class="node" x="32" y="72" width="256" height="32" rx="6"/><circle class="tick" cx="46" cy="88" r="2.5"/><text class="name" x="58" y="92">ETL</text><text class="desc" x="276" y="92" text-anchor="end">customer sync</text></g>
  <g><rect class="node" x="32" y="116" width="256" height="32" rx="6"/><circle class="tick" cx="46" cy="132" r="2.5"/><text class="name" x="58" y="136">API</text><text class="desc" x="276" y="136" text-anchor="end">product writes</text></g>
  <g><rect class="node" x="32" y="160" width="256" height="32" rx="6"/><circle class="tick" cx="46" cy="176" r="2.5"/><text class="name" x="58" y="180">PRODUCT BUS</text><text class="desc" x="276" y="180" text-anchor="end">product catalog</text></g>
  <g><rect class="node" x="32" y="204" width="256" height="32" rx="6"/><circle class="tick" cx="46" cy="220" r="2.5"/><text class="name" x="58" y="224">INDEXER</text><text class="desc" x="276" y="224" text-anchor="end">builds index</text></g>
  <g><rect class="node" x="32" y="248" width="256" height="32" rx="6"/><circle class="tick" cx="46" cy="264" r="2.5"/><text class="name" x="58" y="268">PRODUCT INDEX</text><text class="desc" x="276" y="268" text-anchor="end">index.json</text></g>

  <g>
    <rect class="node" x="28" y="312" width="264" height="72" rx="7"/>
    <text class="name" x="44" y="330">STOREFRONT</text>
    <rect class="tile" x="44" y="340" width="108" height="36" rx="5"/><text class="name" x="56" y="355">PDP</text><text class="desc" x="56" y="370">page request</text>
    <rect class="tile" x="168" y="340" width="108" height="36" rx="5"/><text class="name" x="180" y="355">PLP</text><text class="desc" x="180" y="370">index request</text>
  </g>
  <g><rect class="node" x="32" y="408" width="256" height="44" rx="6"/><circle class="tick" cx="46" cy="426" r="2.5"/><text class="name" x="58" y="430">AEM NETWORK</text><text class="desc" x="58" y="444">routes both requests</text></g>
  <g><rect class="node" x="32" y="476" width="256" height="48" rx="6"/><circle class="tick" cx="46" cy="494" r="2.5"/><text class="name" x="58" y="498">PRODUCT PIPELINE</text><text class="desc" x="58" y="514">PDP HTML · PLP index JSON</text></g>

  <!-- @motion:elements -->
  <circle cx="98" cy="376" r="3.5" fill="var(--pdp)" class="pkt" style="animation-name:m1"/>
  <circle cx="98" cy="408" r="9" fill="none" stroke="var(--pdp)" stroke-width="1.5" class="ring" style="animation-name:m1-ring"/>
  <rect x="32" y="408" width="256" height="44" rx="6" fill="var(--pdp)" class="glow" style="animation-name:m1-glow"/>
  <circle cx="108" cy="452" r="3.5" fill="var(--pdp)" class="pkt" style="animation-name:m2"/>
  <circle cx="108" cy="476" r="9" fill="none" stroke="var(--pdp)" stroke-width="1.5" class="ring" style="animation-name:m2-ring"/>
  <rect x="32" y="476" width="256" height="48" rx="6" fill="var(--pdp)" class="glow" style="animation-name:m2-glow"/>
  <circle cx="288" cy="176" r="3.5" fill="var(--pdp)" class="pkt" style="animation-name:m3"/>
  <circle cx="288" cy="500" r="9" fill="none" stroke="var(--pdp)" stroke-width="1.5" class="ring" style="animation-name:m3-ring"/>
  <rect x="32" y="476" width="256" height="48" rx="6" fill="var(--pdp)" class="glow" style="animation-name:m3-glow"/>
  <circle cx="222" cy="376" r="3.5" fill="var(--plp)" class="pkt" style="animation-name:m4"/>
  <circle cx="222" cy="408" r="9" fill="none" stroke="var(--plp)" stroke-width="1.5" class="ring" style="animation-name:m4-ring"/>
  <rect x="32" y="408" width="256" height="44" rx="6" fill="var(--plp)" class="glow" style="animation-name:m4-glow"/>
  <circle cx="212" cy="452" r="3.5" fill="var(--plp)" class="pkt" style="animation-name:m5"/>
  <circle cx="212" cy="476" r="9" fill="none" stroke="var(--plp)" stroke-width="1.5" class="ring" style="animation-name:m5-ring"/>
  <rect x="32" y="476" width="256" height="48" rx="6" fill="var(--plp)" class="glow" style="animation-name:m5-glow"/>
  <circle cx="32" cy="264" r="3.5" fill="var(--plp)" class="pkt" style="animation-name:m6"/>
  <circle cx="32" cy="500" r="9" fill="none" stroke="var(--plp)" stroke-width="1.5" class="ring" style="animation-name:m6-ring"/>
  <rect x="32" y="476" width="256" height="48" rx="6" fill="var(--plp)" class="glow" style="animation-name:m6-glow"/>
  <!-- @/motion:elements -->
  <g aria-hidden="true"><circle cx="40" cy="548" r="3" fill="var(--pdp)"/><text class="desc" x="51" y="551">PDP / PRODUCT BUS</text><circle cx="176" cy="548" r="3" fill="var(--plp)"/><text class="desc" x="187" y="551">PLP / PRODUCT INDEX</text></g>
</svg>
