<svg xmlns="http://www.w3.org/2000/svg" width="660" height="420" viewBox="0 0 660 420" role="img" aria-label="PIM catalog data reaches Product Bus and Product Index. PDP and PLP requests share AEM Network and Product Pipeline, reading Product Bus and Product Index respectively." aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Catalog updates and PDP and PLP requests</title>
  <desc id="diagram-desc">PIM data passes through ETL and the API into Product Bus. The Indexer builds Product Index. PDP and PLP requests both pass through AEM Network and Product Pipeline. PDP reads Product Bus and returns product HTML; PLP reads Product Index JSON.</desc>
  <defs>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--line)"/></marker>
    <marker id="arrow-pdp" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--pdp)"/></marker>
    <marker id="arrow-plp" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="var(--plp)"/></marker>
    <style>
      :root{color-scheme:dark;--bg:#101824;--node:#151F2D;--tile:#101824;--border:#35465D;--line:#75839A;--text:#F1F5FA;--desc:#A7B3C3;--muted:#8593A8;--pdp:#4CF490;--plp:#02BEFA}
            .frame{fill:var(--bg);stroke:var(--border);stroke-width:1}
      .node{fill:var(--node);stroke:var(--border);stroke-width:1}
      .tile{fill:var(--tile);stroke:var(--border);stroke-width:1}
      .line{fill:none;stroke:var(--line);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
      .pdp-line{fill:none;stroke:var(--pdp);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
      .plp-line{fill:none;stroke:var(--plp);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
      .tick{fill:var(--pdp);animation:tick 2.6s ease-in-out infinite}
      @keyframes tick{0%,100%{opacity:1}50%{opacity:.3}}
      .muted{fill:var(--muted);font:8px system-ui,-apple-system,sans-serif;letter-spacing:1.2px}
      .name{fill:var(--text);font:600 9px system-ui,-apple-system,sans-serif;letter-spacing:.65px}
      .desc{fill:var(--desc);font:8px system-ui,-apple-system,sans-serif}
      .tag{fill:var(--desc);font:7.5px system-ui,-apple-system,sans-serif;letter-spacing:.7px}
      .pkt{animation-timing-function:linear;animation-iteration-count:infinite}
      .ring{transform-box:fill-box;transform-origin:center;opacity:0;animation-timing-function:linear;animation-iteration-count:infinite}
      .glow{opacity:0;animation-timing-function:linear;animation-iteration-count:infinite}
      /* @motion:css */
    /* generated by timeline.py — loop 8s — edit the spec, not this block */
    .story, .pkt, .ring, .glow, .bar { animation-duration: 8s; }
    /* m1: PDP request reaches AEM Network */
    @keyframes m1 {
      0%, 2.5% { transform: translate(0, 0); opacity: 0; }
      3.25% { opacity: 1; }
      8.44% { transform: translate(148px, 0px); }
      9.48% { transform: translate(148px, -26px); }
      11.25% { transform: translate(192px, -26px); opacity: 1; }
      12.75%, 100% { transform: translate(192px, -26px); opacity: 0; }
    }
    @keyframes m1-ring { 0%, 11.25% { transform: scale(0.4); opacity: 0; } 11.75% { transform: scale(0.5); opacity: 0.8; } 17.5%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes m1-glow { 0%, 11.25% { opacity: 0; } 12.25% { opacity: 0.3; } 16.25%, 100% { opacity: 0; } }
    /* m2: AEM Network routes PDP request to Product Pipeline */
    @keyframes m2 {
      0%, 13.75% { transform: translate(0, 0); opacity: 0; }
      14.5% { opacity: 1; }
      21.88% { transform: translate(104px, 0px); opacity: 1; }
      23.38%, 100% { transform: translate(104px, 0px); opacity: 0; }
    }
    @keyframes m2-ring { 0%, 21.88% { transform: scale(0.4); opacity: 0; } 22.38% { transform: scale(0.5); opacity: 0.8; } 28.12%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes m2-glow { 0%, 21.88% { opacity: 0; } 22.88% { opacity: 0.3; } 26.88%, 100% { opacity: 0; } }
    /* m3: Product Pipeline reads PDP data from Product Bus */
    @keyframes m3 {
      0%, 24.38% { transform: translate(0, 0); opacity: 0; }
      25.12% { opacity: 1; }
      27.27% { transform: translate(0px, 72px); }
      33.54% { transform: translate(156px, 72px); }
      35.62% { transform: translate(156px, 124px); opacity: 1; }
      37.12%, 100% { transform: translate(156px, 124px); opacity: 0; }
    }
    @keyframes m3-ring { 0%, 35.62% { transform: scale(0.4); opacity: 0; } 36.12% { transform: scale(0.5); opacity: 0.8; } 41.88%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes m3-glow { 0%, 35.62% { opacity: 0; } 36.62% { opacity: 0.3; } 40.62%, 100% { opacity: 0; } }
    /* m4: PLP index request reaches AEM Network */
    @keyframes m4 {
      0%, 45.63% { transform: translate(0, 0); opacity: 0; }
      46.38% { opacity: 1; }
      51.56% { transform: translate(80px, 0px); }
      52% { transform: translate(80px, 6px); }
      54.38% { transform: translate(112px, 6px); opacity: 1; }
      55.88%, 100% { transform: translate(112px, 6px); opacity: 0; }
    }
    @keyframes m4-ring { 0%, 54.38% { transform: scale(0.4); opacity: 0; } 54.88% { transform: scale(0.5); opacity: 0.8; } 60.63%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes m4-glow { 0%, 54.38% { opacity: 0; } 55.38% { opacity: 0.3; } 59.38%, 100% { opacity: 0; } }
    /* m5: AEM Network routes PLP request to Product Pipeline */
    @keyframes m5 {
      0%, 56.88% { transform: translate(0, 0); opacity: 0; }
      57.63% { opacity: 1; }
      65% { transform: translate(104px, 0px); opacity: 1; }
      66.5%, 100% { transform: translate(104px, 0px); opacity: 0; }
    }
    @keyframes m5-ring { 0%, 65% { transform: scale(0.4); opacity: 0; } 65.5% { transform: scale(0.5); opacity: 0.8; } 71.25%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes m5-glow { 0%, 65% { opacity: 0; } 66% { opacity: 0.3; } 70%, 100% { opacity: 0; } }
    /* m6: Product Pipeline reads PLP data from Product Index */
    @keyframes m6 {
      0%, 67.5% { transform: translate(0, 0); opacity: 0; }
      68.25% { opacity: 1; }
      73.13% { transform: translate(0px, 72px); }
      74.69% { transform: translate(20px, 72px); }
      78.75% { transform: translate(20px, 124px); opacity: 1; }
      80.25%, 100% { transform: translate(20px, 124px); opacity: 0; }
    }
    @keyframes m6-ring { 0%, 78.75% { transform: scale(0.4); opacity: 0; } 79.25% { transform: scale(0.5); opacity: 0.8; } 85%, 100% { transform: scale(1.4); opacity: 0; } }
    @keyframes m6-glow { 0%, 78.75% { opacity: 0; } 79.75% { opacity: 0.3; } 83.75%, 100% { opacity: 0; } }
    /* @/motion:css */
      @media (prefers-reduced-motion: reduce){.pkt,.ring,.glow{animation:none!important;visibility:hidden}.tick{animation:none!important}}
    </style>
  </defs>
  <rect class="frame" x=".5" y=".5" width="659" height="419" rx="12"/>
  <text class="muted" x="28" y="52">CATALOG UPDATE</text>
  <text class="muted" x="28" y="244">STOREFRONT REQUESTS</text>

  <!-- Static catalog update path: PIM → ETL → API → Product Bus → Indexer → Product Index. -->
  <g class="line" marker-end="url(#arrow)">
    <path d="M108 108H120"/><path d="M204 108H216"/><path d="M300 108H312"/>
    <path d="M416 108H428"/><path d="M516 108H528"/>
  </g>
  <!-- Static storefront and product-data paths. -->
  <path class="pdp-line" d="M72 306H220V280H264" marker-end="url(#arrow-pdp)"/>
  <path class="plp-line" d="M152 306H232V312H264" marker-end="url(#arrow-plp)"/>
  <path class="pdp-line" d="M376 280H480" marker-end="url(#arrow-pdp)"/>
  <path class="plp-line" d="M376 312H480" marker-end="url(#arrow-plp)"/>
  <path class="pdp-line" d="M364 136V208H520V260" marker-end="url(#arrow-pdp)"/>
  <path class="plp-line" d="M588 136V208H608V260" marker-end="url(#arrow-plp)"/>
  <text class="tag" x="424" y="200">PDP DATA</text>
  <text class="tag" x="604" y="200" text-anchor="end">PLP INDEX</text>

  <g><rect class="node" x="24" y="80" width="84" height="56" rx="7"/><circle class="tick" cx="38" cy="96" r="2.5"/><text class="name" x="48" y="100">PIM</text><text class="desc" x="36" y="120">catalog source</text></g>
  <g><rect class="node" x="120" y="80" width="84" height="56" rx="7"/><circle class="tick" cx="134" cy="96" r="2.5"/><text class="name" x="144" y="100">ETL</text><text class="desc" x="132" y="120">customer sync</text></g>
  <g><rect class="node" x="216" y="80" width="84" height="56" rx="7"/><circle class="tick" cx="230" cy="96" r="2.5"/><text class="name" x="240" y="100">API</text><text class="desc" x="228" y="120">product writes</text></g>
  <g><rect class="node" x="312" y="80" width="104" height="56" rx="7"/><circle class="tick" cx="326" cy="96" r="2.5"/><text class="name" x="336" y="100">PRODUCT BUS</text><text class="desc" x="324" y="120">product catalog</text></g>
  <g><rect class="node" x="428" y="80" width="88" height="56" rx="7"/><circle class="tick" cx="442" cy="96" r="2.5"/><text class="name" x="452" y="100">INDEXER</text><text class="desc" x="440" y="120">builds index</text></g>
  <g><rect class="node" x="528" y="80" width="120" height="56" rx="7"/><circle class="tick" cx="542" cy="96" r="2.5"/><text class="name" x="552" y="100">PRODUCT INDEX</text><text class="desc" x="540" y="120">index.json</text></g>

  <g>
    <rect class="node" x="24" y="260" width="176" height="80" rx="7"/>
    <text class="name" x="36" y="276">STOREFRONT</text>
    <rect class="tile" x="36" y="284" width="72" height="44" rx="5"/><text class="name" x="48" y="301">PDP</text><text class="desc" x="48" y="317">page request</text>
    <rect class="tile" x="116" y="284" width="72" height="44" rx="5"/><text class="name" x="128" y="301">PLP</text><text class="desc" x="128" y="317">index request</text>
  </g>
  <g><rect class="node" x="264" y="260" width="112" height="72" rx="7"/><circle class="tick" cx="278" cy="276" r="2.5"/><text class="name" x="288" y="280">AEM NETWORK</text><text class="desc" x="276" y="300">routes both requests</text></g>
  <g><rect class="node" x="480" y="260" width="168" height="72" rx="7"/><circle class="tick" cx="494" cy="276" r="2.5"/><text class="name" x="504" y="280">PRODUCT PIPELINE</text><text class="desc" x="492" y="300">PDP HTML · PLP index JSON</text></g>

  <!-- @motion:elements -->
  <circle cx="72" cy="306" r="3.5" fill="var(--pdp)" class="pkt" style="animation-name:m1"/>
  <circle cx="264" cy="280" r="9" fill="none" stroke="var(--pdp)" stroke-width="1.5" class="ring" style="animation-name:m1-ring"/>
  <rect x="264" y="260" width="112" height="72" rx="7" fill="var(--pdp)" class="glow" style="animation-name:m1-glow"/>
  <circle cx="376" cy="280" r="3.5" fill="var(--pdp)" class="pkt" style="animation-name:m2"/>
  <circle cx="480" cy="280" r="9" fill="none" stroke="var(--pdp)" stroke-width="1.5" class="ring" style="animation-name:m2-ring"/>
  <rect x="480" y="260" width="168" height="72" rx="7" fill="var(--pdp)" class="glow" style="animation-name:m2-glow"/>
  <circle cx="364" cy="136" r="3.5" fill="var(--pdp)" class="pkt" style="animation-name:m3"/>
  <circle cx="520" cy="260" r="9" fill="none" stroke="var(--pdp)" stroke-width="1.5" class="ring" style="animation-name:m3-ring"/>
  <rect x="480" y="260" width="168" height="72" rx="7" fill="var(--pdp)" class="glow" style="animation-name:m3-glow"/>
  <circle cx="152" cy="306" r="3.5" fill="var(--plp)" class="pkt" style="animation-name:m4"/>
  <circle cx="264" cy="312" r="9" fill="none" stroke="var(--plp)" stroke-width="1.5" class="ring" style="animation-name:m4-ring"/>
  <rect x="264" y="260" width="112" height="72" rx="7" fill="var(--plp)" class="glow" style="animation-name:m4-glow"/>
  <circle cx="376" cy="312" r="3.5" fill="var(--plp)" class="pkt" style="animation-name:m5"/>
  <circle cx="480" cy="312" r="9" fill="none" stroke="var(--plp)" stroke-width="1.5" class="ring" style="animation-name:m5-ring"/>
  <rect x="480" y="260" width="168" height="72" rx="7" fill="var(--plp)" class="glow" style="animation-name:m5-glow"/>
  <circle cx="588" cy="136" r="3.5" fill="var(--plp)" class="pkt" style="animation-name:m6"/>
  <circle cx="608" cy="260" r="9" fill="none" stroke="var(--plp)" stroke-width="1.5" class="ring" style="animation-name:m6-ring"/>
  <rect x="480" y="260" width="168" height="72" rx="7" fill="var(--plp)" class="glow" style="animation-name:m6-glow"/>
  <!-- @/motion:elements -->
  <g aria-hidden="true"><circle cx="36" cy="388" r="3" fill="var(--pdp)"/><text class="desc" x="46" y="391">PDP / PRODUCT BUS</text><circle cx="224" cy="388" r="3" fill="var(--plp)"/><text class="desc" x="234" y="391">PLP / PRODUCT INDEX</text></g>
</svg>
